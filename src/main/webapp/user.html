<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="">
    <title>User info</title>
    <link rel="stylesheet" href="css/util.css">
    <script src="js/jquery-4.0.0.js.js" type="text/javascript" defer></script>
    <script src="js/user.js" type="text/javascript" defer></script>
</head>
<body>
    <header>
        <h1>User info</h1>
    </header>
    <main>
        <article>
            <div>
                <form action="/user/logout" method="post">
                    <input type="submit" value="logout">
                </form>
            </div>
            <div>
                <input type="button" value="query" id="query"/>
                <table>
                    <thead>
                        <tr>
                            <td>id</td>
                            <td>student_no</td>
                            <td>name</td>
                            <td>age</td>
                            <td>grade</td>
                        </tr>
                    </thead>
                    <tbody id="content"></tbody>
                </table>
            </div>
            <br />
            <div>
                <form id="upload_form" action="/user/upload" method="post" enctype="multipart/form-data">
                    <input type="text" name="description" />
                    <input type="file" name="file" id="file" multiple />
                    <input type="submit" value="Upload" />
                </form>
            </div>
            <div>
                <a href="/user/download?filename=user.html">download page</a>
            </div>
        </article>
    </main>
</body>
</html>
